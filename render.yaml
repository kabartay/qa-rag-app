# Deploys Simple RAG, Enhanced RAG, Evaluator, and Q&A Generator with shared Redis cache

services:
  - type: web
    name: qa-rag-simple
    env: docker
    plan: free
    region: virginia
    envVars:
      - key: USE_CACHE
        value: true
      - key: REDIS_URL
        fromService:
          name: qa-rag-cache
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: qa-rag-app
      - key: LANGSMITH_TRACING
        value: true
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com

  - type: web
    name: qa-rag-enhanced
    env: docker
    plan: free
    region: virginia
    envVars:
      - key: USE_CACHE
        value: true
      - key: REDIS_URL
        fromService:
          name: qa-rag-cache
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: qa-rag-app
      - key: LANGSMITH_TRACING
        value: true
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com

  - type: web
    name: qa-rag-evaluator
    env: docker
    plan: free
    region: virginia
    envVars:
      - key: USE_CACHE
        value: true
      - key: REDIS_URL
        fromService:
          name: qa-rag-cache
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: qa-rag-app
      - key: LANGSMITH_TRACING
        value: true
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com

  - type: web
    name: qa-generator
    env: docker
    plan: free
    region: virginia
    envVars:
      - key: USE_CACHE
        value: true
      - key: REDIS_URL
        fromService:
          name: qa-rag-cache
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: qa-rag-app
      - key: LANGSMITH_TRACING
        value: true
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com

  # Shared Redis Cache
  - type: redis
    name: qa-rag-cache
    plan: free
    region: virginia
    ipAllowList: [] # Empty list means allow all Render services in the same network
