[project]
name = "qa-rag-app"
version = "1.0.0"
description = "RAG application with QA and automated evaluation for PDF documents"
authors = [
    {name = "Mukharbek Organokov", email = "mukharbek.organokov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["rag", "llm", "evaluation", "nlp", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "streamlit>=1.32.0",
    "anthropic>=0.25.0",
    "cohere>=5.3.0",
    "pinecone>=5.0.0",
    "PyPDF2>=3.0.1",
    "pdfplumber>=0.10.4",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.3",
    "nltk>=3.8.1",
    "spacy>=3.7.4",
    "tiktoken>=0.6.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",
    "tqdm>=4.66.2",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "black>=24.3.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "types-redis>=4.6.0.20241004",
]

monitoring = [
    "langsmith>=0.1.23",
    "prometheus-client>=0.20.0",
]

all = [
    "qa-rag-app[dev,monitoring]",
]

[project.urls]
Homepage = "https://github.com/kabartay/qa-rag-app"
Documentation = "https://github.com/kabartay/qa-rag-app#readme"
Repository = "https://github.com/kabartay/qa-rag-app"
Issues = "https://github.com/kabartay/qa-rag-app/issues"

[project.scripts]
rag-simple = "apps.rag_app:main"
rag-enhanced = "apps.rag_app_enhanced:main"
rag-evaluate = "apps.rag_evaluator:main"
qa-generator = "apps.qa_generator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C", "B", "UP",
]
ignore = [
    "E501", "B008", "C901",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"apps/rag_app*.py" = ["E402"]
"apps/rag_evaluator.py" = ["E402"]
"apps/qa_generator.py" = ["E402"]
"apps/monitoring.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "pinecone.*",
    "cohere.*",
    "streamlit.*",
    "redis.*",
    "dotenv.*",
    "PyPDF2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=apps/ --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
